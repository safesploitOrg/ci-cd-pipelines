name: LAMP Stack Setup

on: push

jobs:
  setup-lamp:
    runs-on: ubuntu-latest

    #   Use hardcoded values for local testing
    # env:
    #   MYSQL_ROOT_PASSWORD: rootpass
    #   MYSQL_USER: ciuser
    #   MYSQL_PASSWORD: cisecret
    #   MYSQL_DATABASE: testdb

    #   Use GitHub secrets for production
    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
    #   Use GitHub variables
      MYSQL_USER: ${{ vars.MYSQL_USER }}
      MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: DEBUGGING env vars (temporary)
        run: |
          echo "MYSQL_ROOT_PASSWORD = $MYSQL_ROOT_PASSWORD"
          echo "MYSQL_USER = $MYSQL_USER"
          echo "MYSQL_PASSWORD = $MYSQL_PASSWORD"
          echo "MYSQL_DATABASE = $MYSQL_DATABASE"
        shell: bash

      - name: Install Apache
        run: |
          sudo apt update
          sudo apt install -y apache2
          sudo systemctl start apache2
          sudo systemctl enable apache2

      - name: Install PHP
        run: |
          sudo apt install -y php libapache2-mod-php php-mysql
          sudo systemctl restart apache2

      - name: Install MySQL (only install)
        run: |
          sudo apt install -y mysql-server
          sudo systemctl start mysql
          sudo systemctl enable mysql
          sudo systemctl status mysql

      - name: Configure MySQL (user, password, db)
        run: |
          # WARNING: This uses skip-grant-tables for speed in CI/CD.
          # Do NOT reuse in production or saved Docker images.
          echo "[mysqld]" | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf
          echo "skip-grant-tables" | sudo tee -a /etc/mysql/mysql.conf.d/mysqld.cnf
          sudo systemctl restart mysql

          # Set root password
          sudo mysql -e "FLUSH PRIVILEGES; ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '${MYSQL_ROOT_PASSWORD}';"

          # Re-enable auth
          sudo sed -i '/skip-grant-tables/d' /etc/mysql/mysql.conf.d/mysqld.cnf
          sudo systemctl restart mysql

          # Create database and user
          sudo mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "CREATE DATABASE ${MYSQL_DATABASE};"
          sudo mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "CREATE USER '${MYSQL_USER}'@'localhost' IDENTIFIED BY '${MYSQL_PASSWORD}';"
          sudo mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "GRANT ALL PRIVILEGES ON ${MYSQL_DATABASE}.* TO '${MYSQL_USER}'@'localhost'; FLUSH PRIVILEGES;"


      - name: Prepare and Import SQL Dump
        run: |
          cp ./db/testdb.sql ./db/testdb.temp.sql

          sed -i "s/USERNAME_HERE/${MYSQL_USER}/g" ./db/testdb.temp.sql
          sed -i "s/PASSWORD_HERE/${MYSQL_PASSWORD}/g" ./db/testdb.temp.sql
          sed -i "s/DATABASE_NAME_HERE/${MYSQL_DATABASE}/g" ./db/testdb.temp.sql

          mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" < ./db/testdb.temp.sql
        shell: bash

      - name: DEBUGGING MySQL Verify Database
        run: |
          mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "SHOW DATABASES;"
          mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "SHOW GRANTS FOR '${MYSQL_USER}'@'localhost';"
          mysql -uroot -p${MYSQL_ROOT_PASSWORD} ${MYSQL_DATABASE} -e "SHOW TABLES;"
          mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e "SELECT * FROM ${MYSQL_DATABASE}.users;"

      - name: DEBUGGING Check Versions
        run: |
          apache2 -v
          php -v
          mysql -V

      - name: DEBUGGING Verify Apache is Running
        run: |
          curl -I http://localhost

      - name: DEBUGGING Create PHP Info Page
        run: |
          echo "<?php phpinfo(); ?>" | sudo tee /var/www/html/info.php

      - name:  DEBUGGING Verify PHP Page is Accessible
        run: |
          curl http://localhost/info.php